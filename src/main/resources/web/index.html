<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>sift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fcfcfd;
            --surface: #ffffff;
            --ink: #1c2230;
            --muted: #5e6677;
            --line: #e3e6ec;
            --field: #ffffff;
            --field-line: #d4d8e0;
            --link: #2b44b8;
            --visited: #6b3fa8;
            --accent: #127a72;
            --hover: #f1f3f6;
            --error: #b42318;
            --shadow: 0 1px 6px rgba(28, 34, 48, 0.12);
            /* Results-page left edge: page gutter + wordmark + gap. Tabs and results align to it. */
            --gutter: 24px;
            --mark: 86px;
            --rail: calc(var(--gutter) + var(--mark) + 28px);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --paper: #15181e;
                --surface: #1b1f27;
                --ink: #e6e8ee;
                --muted: #9aa2b1;
                --line: #2a303b;
                --field: #1f242d;
                --field-line: #353c49;
                --link: #9db0ff;
                --visited: #c7a6f2;
                --accent: #4fc2b6;
                --hover: #232833;
                --error: #ff8a7a;
                --shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
            }
        }

        :root[data-theme="dark"] {
            --paper: #15181e;
            --surface: #1b1f27;
            --ink: #e6e8ee;
            --muted: #9aa2b1;
            --line: #2a303b;
            --field: #1f242d;
            --field-line: #353c49;
            --link: #9db0ff;
            --visited: #c7a6f2;
            --accent: #4fc2b6;
            --hover: #232833;
            --error: #ff8a7a;
            --shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            color: var(--ink);
            font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }

        a {
            color: var(--link);
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* ---------- wordmark ---------- */

        .wordmark {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 600;
            font-variation-settings: "opsz" 144;
            color: var(--ink);
            text-decoration: none;
            letter-spacing: -0.03em;
            line-height: 1;
            display: inline-flex;
            align-items: baseline;
            user-select: none;
        }

        /* The dotless i carries a square "tittle": one posting block. */
        .wordmark .i {
            position: relative;
        }

        .wordmark .i::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 0.19em;
            width: 0.13em;
            height: 0.13em;
            transform: translateX(-50%);
            background: var(--accent);
        }

        /* ---------- search field ---------- */

        .search-form {
            position: relative;
            width: 100%;
        }

        /* Autocomplete: the field and list read as one surface while open. */
        .search-form.open .search-field {
            border-radius: 24px 24px 0 0;
            box-shadow: var(--shadow);
            border-color: transparent;
        }

        .suggestions {
            position: absolute;
            z-index: 20;
            left: 0;
            right: 0;
            top: 100%;
            margin: 0;
            padding: 6px 0 10px;
            list-style: none;
            background: var(--field);
            border-radius: 0 0 24px 24px;
            box-shadow: var(--shadow);
            border-top: 1px solid var(--line);
        }

        .suggestions li {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 7px 18px;
            cursor: pointer;
            font-size: 15px;
        }

        .suggestions li svg {
            flex: none;
            width: 16px;
            height: 16px;
            color: var(--muted);
        }

        .suggestions li[aria-selected="true"],
        .suggestions li:hover {
            background: var(--hover);
        }

        .suggestions .typed {
            font-weight: 400;
        }

        .suggestions .rest {
            font-weight: 600;
        }

        .spelling {
            margin: 14px 0 -8px;
            font-size: 15px;
        }

        .spelling a {
            font-weight: 600;
            font-style: italic;
        }

        .spelling .muted {
            color: var(--muted);
            font-size: 14px;
        }

        .search-field {
            display: flex;
            align-items: center;
            height: 48px;
            padding: 0 6px 0 18px;
            background: var(--field);
            border: 1px solid var(--field-line);
            border-radius: 24px;
            transition: box-shadow 120ms ease, border-color 120ms ease;
        }

        .search-field:hover,
        .search-field:focus-within {
            box-shadow: var(--shadow);
            border-color: transparent;
        }

        .search-field input {
            flex: 1;
            min-width: 0;
            height: 100%;
            border: 0;
            background: transparent;
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            outline: none;
        }

        .search-field input::-webkit-search-cancel-button {
            display: none;
        }

        .icon-button {
            display: inline-grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .icon-button:hover {
            background: var(--hover);
            color: var(--ink);
        }

        .icon-button svg {
            width: 20px;
            height: 20px;
        }

        .clear-button[hidden] {
            display: none;
        }

        .divider {
            width: 1px;
            height: 24px;
            background: var(--line);
            margin: 0 4px;
        }

        .submit-button {
            color: var(--accent);
        }

        /* ---------- home ---------- */

        .home {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 16px;
        }

        .home .wordmark {
            font-size: clamp(64px, 14vw, 104px);
            margin: max(14vh, 64px) 0 32px;
        }

        .home-search {
            width: 100%;
            max-width: 584px;
        }

        .home-actions {
            display: flex;
            gap: 10px;
            margin-top: 26px;
        }

        .home-actions button {
            height: 36px;
            padding: 0 16px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            color: var(--ink);
            font: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .home-actions button:hover {
            border-color: var(--field-line);
            box-shadow: var(--shadow);
        }

        /* ---------- results page ---------- */

        .results-page {
            flex: 1;
            /* Flex items default to min-width: auto; without this a long
               no-wrap breadcrumb widens the whole page on phones. */
            min-width: 0;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--paper);
            border-bottom: 1px solid var(--line);
        }

        .topbar-row {
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 18px var(--gutter);
        }

        .topbar .wordmark {
            font-size: 34px;
            flex: none;
            width: var(--mark);
        }

        .top-search {
            flex: 1;
            min-width: 0;
            max-width: 692px;
        }

        .topbar .search-field {
            height: 44px;
        }

        .theme-toggle {
            margin-left: auto;
            flex: none;
        }

        main.results-main {
            padding: 0 var(--gutter) 48px var(--rail);
            max-width: calc(var(--rail) + 652px + var(--gutter));
        }

        .stats {
            margin: 14px 0 22px;
            color: var(--muted);
            font-size: 13px;
            min-height: 20px;
        }

        .results {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .result {
            margin-bottom: 30px;
        }

        .crumb {
            display: block;
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .crumb .host {
            color: var(--ink);
        }

        .result h3 {
            margin: 3px 0 4px;
            font-size: 19px;
            font-weight: 500;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .result h3 a {
            text-decoration: none;
        }

        .result h3 a:hover {
            text-decoration: underline;
        }

        .result h3 a:visited {
            color: var(--visited);
        }

        .snippet {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.58;
        }

        .snippet b {
            color: var(--ink);
            font-weight: 600;
        }

        .empty h2 {
            margin: 8px 0 10px;
            font-size: 18px;
            font-weight: 500;
        }

        .empty ul {
            margin: 0;
            padding-left: 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .empty.error h2 {
            color: var(--error);
        }

        .pager {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 40px 0 8px;
            flex-wrap: wrap;
        }

        .pager button {
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            border: 0;
            border-radius: 18px;
            background: transparent;
            color: var(--link);
            font: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .pager button:hover:not(:disabled) {
            background: var(--hover);
        }

        .pager button[aria-current="page"] {
            color: var(--paper);
            background: var(--ink);
            font-weight: 600;
            cursor: default;
        }

        .pager button:disabled:not([aria-current]) {
            color: var(--muted);
            opacity: 0.5;
            cursor: default;
        }

        .pager .step {
            font-weight: 500;
        }

        .skeleton {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .skeleton li {
            margin-bottom: 30px;
        }

        .skeleton span {
            display: block;
            height: 12px;
            margin-bottom: 9px;
            border-radius: 6px;
            background: var(--hover);
        }

        [hidden] {
            display: none !important;
        }

        /* ---------- small screens ---------- */

        @media (max-width: 860px) {
            .topbar-row {
                flex-wrap: wrap;
                gap: 12px 16px;
                padding: 12px 16px;
            }

            .topbar .wordmark {
                font-size: 28px;
                width: auto;
            }

            .top-search {
                order: 3;
                max-width: none;
                flex-basis: 100%;
            }

            main.results-main {
                padding: 0 16px 40px;
                max-width: none;
            }

        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-clear" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-theme" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>
    </symbol>
</svg>

<template id="search-form-template">
    <form class="search-form" role="search">
        <label class="visually-hidden" for="">Search</label>
        <div class="search-field">
            <input type="search" name="q" autocomplete="off" spellcheck="false" enterkeyhint="search">
            <button class="icon-button clear-button" type="button" aria-label="Clear search" hidden>
                <svg><use href="#icon-clear"/></svg>
            </button>
            <span class="divider" aria-hidden="true"></span>
            <button class="icon-button submit-button" type="submit" aria-label="Search">
                <svg><use href="#icon-search"/></svg>
            </button>
        </div>
    </form>
</template>

<!-- Home -->
<div class="home" id="home">
    <a class="wordmark" href="/" aria-label="sift home">s<span class="i">ı</span>ft</a>
    <div class="home-search" id="home-search"></div>
    <div class="home-actions">
        <button type="button" id="home-submit">Search</button>
        <button type="button" id="home-lucky">Try a random topic</button>
    </div>
</div>

<!-- Results -->
<div class="results-page" id="results-page" hidden>
    <header class="topbar">
        <div class="topbar-row">
            <a class="wordmark" href="/" aria-label="sift home">s<span class="i">ı</span>ft</a>
            <div class="top-search" id="top-search"></div>
            <button class="icon-button theme-toggle" type="button" id="theme-toggle" aria-label="Switch light or dark theme">
                <svg><use href="#icon-theme"/></svg>
            </button>
        </div>
    </header>

    <main class="results-main">
        <p class="spelling" id="spelling" hidden></p>
        <p class="stats" id="stats" role="status" aria-live="polite"></p>
        <ol class="results" id="results"></ol>
        <nav class="pager" id="pager" aria-label="Pages"></nav>
    </main>
</div>

<script>
(function () {
    "use strict";

    const PAGE_SIZE = 10;
    const MAX_RESULTS = 500;
    // Words the index ignores (the engine's stopword list), so they are never emboldened.
    const IGNORED_WORDS = new Set(["a", "an", "the", "is", "are", "was", "were", "in", "on", "at", "to",
        "for", "of", "and", "or", "not", "this", "that", "these", "those", "be", "been", "being"]);

    const state = { q: "", page: 1 };
    let requestId = 0;

    // ---------- theme ----------

    function readTheme() {
        try { return localStorage.getItem("sift-theme"); } catch (e) { return null; }
    }

    function applyTheme(theme) {
        if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
        } else {
            delete document.documentElement.dataset.theme;
        }
    }

    applyTheme(readTheme());

    document.getElementById("theme-toggle").addEventListener("click", () => {
        const current = document.documentElement.dataset.theme
            || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        const next = current === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem("sift-theme", next); } catch (e) { /* storage unavailable */ }
    });

    // ---------- search boxes ----------

    function mountSearch(container, id) {
        const node = document.getElementById("search-form-template").content.firstElementChild.cloneNode(true);
        const input = node.querySelector("input");
        const clear = node.querySelector(".clear-button");
        input.id = id;
        node.querySelector("label").htmlFor = id;

        // Autocomplete list (ARIA combobox pattern).
        const list = document.createElement("ul");
        list.className = "suggestions";
        list.id = id + "-suggestions";
        list.setAttribute("role", "listbox");
        list.hidden = true;
        node.appendChild(list);
        input.setAttribute("role", "combobox");
        input.setAttribute("aria-autocomplete", "list");
        input.setAttribute("aria-controls", list.id);
        input.setAttribute("aria-expanded", "false");

        let items = [];
        let active = -1;
        let typed = "";
        let timer = 0;
        let sequence = 0;

        function close() {
            list.hidden = true;
            node.classList.remove("open");
            input.setAttribute("aria-expanded", "false");
            input.removeAttribute("aria-activedescendant");
            active = -1;
        }

        function highlight(index) {
            active = index;
            Array.from(list.children).forEach((li, i) => li.setAttribute("aria-selected", String(i === index)));
            if (index >= 0) {
                input.setAttribute("aria-activedescendant", list.children[index].id);
                input.value = items[index];
            } else {
                input.removeAttribute("aria-activedescendant");
                input.value = typed;
            }
        }

        function show(suggestions) {
            items = suggestions.filter(s => s.toLowerCase() !== typed.trim().toLowerCase());
            list.innerHTML = "";
            if (!items.length || document.activeElement !== input) { close(); return; }
            items.forEach((text, i) => {
                const li = document.createElement("li");
                li.id = list.id + "-" + i;
                li.setAttribute("role", "option");
                const lower = text.toLowerCase();
                const prefix = typed.trim().toLowerCase();
                const split = lower.startsWith(prefix) ? prefix.length : 0;
                li.innerHTML = '<svg aria-hidden="true"><use href="#icon-search"/></svg><span><span class="typed">' +
                    escapeHtml(text.slice(0, split)) + '</span><span class="rest">' + escapeHtml(text.slice(split)) + "</span></span>";
                // mousedown (not click) so the input does not blur first.
                li.addEventListener("mousedown", event => {
                    event.preventDefault();
                    input.value = text;
                    close();
                    node.requestSubmit();
                });
                list.appendChild(li);
            });
            active = -1;
            list.hidden = false;
            node.classList.add("open");
            input.setAttribute("aria-expanded", "true");
        }

        input.addEventListener("input", () => {
            clear.hidden = input.value === "";
            typed = input.value;
            clearTimeout(timer);
            if (!typed.trim()) { close(); return; }
            const mine = ++sequence;
            timer = setTimeout(async () => {
                try {
                    const response = await fetch("/suggest?q=" + encodeURIComponent(typed));
                    const data = await response.json();
                    if (mine === sequence) show(data.suggestions || []);
                } catch (e) { close(); }
            }, 120);
        });

        input.addEventListener("keydown", event => {
            if (list.hidden) return;
            if (event.key === "ArrowDown") {
                event.preventDefault();
                highlight(active + 1 >= items.length ? -1 : active + 1);
            } else if (event.key === "ArrowUp") {
                event.preventDefault();
                highlight(active - 1 < -1 ? items.length - 1 : active - 1);
            } else if (event.key === "Escape") {
                event.preventDefault();
                input.value = typed;
                close();
            }
        });

        input.addEventListener("blur", close);

        clear.addEventListener("click", () => {
            input.value = "";
            typed = "";
            clear.hidden = true;
            close();
            input.focus();
        });
        node.addEventListener("submit", event => {
            event.preventDefault();
            close();
            const q = input.value.trim();
            if (q) navigate({ q: q, page: 1 });
            else input.focus();
        });
        container.appendChild(node);
        return {
            input: input,
            set(value) { input.value = value; typed = value; clear.hidden = value === ""; close(); }
        };
    }

    const homeSearch = mountSearch(document.getElementById("home-search"), "home-q");
    const topSearch = mountSearch(document.getElementById("top-search"), "top-q");
    homeSearch.input.setAttribute("aria-label", "Search");
    topSearch.input.setAttribute("aria-label", "Search");

    document.getElementById("home-submit").addEventListener("click", () => {
        homeSearch.input.form.requestSubmit();
    });

    // Searches one of a few broad topics, for a first look at the index.
    document.getElementById("home-lucky").addEventListener("click", () => {
        const words = ["history", "city", "music", "science", "river", "war", "art", "language", "animal", "film"];
        navigate({ q: words[Math.floor(Math.random() * words.length)], page: 1 });
    });

    // "/" focuses the search box, as on most search sites.
    document.addEventListener("keydown", event => {
        if (event.key !== "/" || event.target.matches("input, select, textarea")) return;
        event.preventDefault();
        (state.q ? topSearch : homeSearch).input.focus();
    });

    // ---------- URL state ----------

    function readUrl() {
        const params = new URLSearchParams(location.search);
        state.q = (params.get("q") || "").trim();
        state.page = Math.max(1, parseInt(params.get("page"), 10) || 1);
    }

    function writeUrl(replace) {
        const params = new URLSearchParams();
        if (state.q) params.set("q", state.q);
        if (state.q && state.page > 1) params.set("page", state.page);
        const url = params.toString() ? "/?" + params : "/";
        history[replace ? "replaceState" : "pushState"](null, "", url);
    }

    function navigate(change) {
        Object.assign(state, change);
        writeUrl(false);
        render();
        if (change.page) window.scrollTo(0, 0);
    }

    window.addEventListener("popstate", () => { readUrl(); render(); });

    // ---------- rendering ----------

    const home = document.getElementById("home");
    const resultsPage = document.getElementById("results-page");
    const stats = document.getElementById("stats");
    const spelling = document.getElementById("spelling");
    const list = document.getElementById("results");
    const pager = document.getElementById("pager");

    function render() {
        const searching = state.q !== "";
        home.hidden = searching;
        resultsPage.hidden = !searching;
        document.title = searching ? state.q + " - sift" : "sift";

        if (!searching) {
            homeSearch.set("");
            homeSearch.input.focus();
            return;
        }

        topSearch.set(state.q);
        runSearch();
    }

    // The kind of search is read from the query, as on web search engines:
    // a fully quoted query is an exact phrase, and capitalised AND / OR / NOT
    // make a boolean query. Everything else is a ranked keyword search.
    function detectMode(query) {
        if (/\b(AND|OR|NOT)\b/.test(query)) return "bool";
        if (/^"[^"]+"$/.test(query.trim())) return "phrase";
        return "search";
    }

    async function runSearch() {
        const id = ++requestId;
        const offset = Math.min((state.page - 1) * PAGE_SIZE, MAX_RESULTS - PAGE_SIZE);
        const params = new URLSearchParams({ q: state.q, limit: PAGE_SIZE, offset: offset });
        let mode = detectMode(state.q);

        stats.textContent = "";
        spelling.hidden = true;
        pager.innerHTML = "";
        showSkeleton();

        let data;
        try {
            let response = await fetch("/" + mode + "?" + params);
            // An incomplete boolean expression ("rock AND") runs as a keyword search instead.
            if (mode === "bool" && response.status === 400) {
                mode = "search";
                response = await fetch("/search?" + params);
            }
            data = await response.json();
            if (!response.ok) throw new Error(data.error || "the server returned " + response.status);
        } catch (error) {
            if (id === requestId) showError(error.message);
            return;
        }

        if (id !== requestId) return;
        showResults(data, offset, mode);
    }

    function showSkeleton() {
        list.className = "skeleton";
        list.innerHTML = Array.from({ length: 4 }, () =>
            '<li><span style="width:38%"></span><span style="width:62%;height:18px"></span>' +
            '<span style="width:96%"></span><span style="width:78%"></span></li>').join("");
    }

    function showSpelling(data) {
        if (data.correctedFrom) {
            spelling.hidden = false;
            spelling.innerHTML = 'Showing results for <a href="#">' + escapeHtml(data.suggestion) + "</a>" +
                '<br><span class="muted">No results for ' + escapeHtml(data.correctedFrom) + "</span>";
            spelling.querySelector("a").addEventListener("click", event => {
                event.preventDefault();
                navigate({ q: data.suggestion, page: 1 });
            });
        } else if (data.suggestion) {
            spelling.hidden = false;
            spelling.innerHTML = 'Did you mean: <a href="#">' + escapeHtml(data.suggestion) + "</a>";
            spelling.querySelector("a").addEventListener("click", event => {
                event.preventDefault();
                navigate({ q: data.suggestion, page: 1 });
            });
        }
    }

    function showResults(data, offset, mode) {
        const results = data.results || [];
        list.className = "results";
        list.innerHTML = "";
        showSpelling(data);

        const took = typeof data.tookMs === "number" ? formatMillis(data.tookMs) : "";
        if (results.length === 0) {
            stats.textContent = took ? "No results (" + took + ")" : "";
            showEmpty(mode);
            return;
        }

        const pagePrefix = state.page > 1 ? "Page " + state.page + " of " : "";
        if (typeof data.total === "number") {
            const count = mode === "phrase"
                ? plural(data.total, "exact match", "exact matches")
                : plural(data.total, "result", "results");
            stats.textContent = pagePrefix + count + " (" + took + ")";
        } else {
            stats.textContent = (state.page > 1 ? "Page " + state.page : "Top results") + " (" + took + ")";
        }

        // Bold the words of the query the results are actually for.
        const terms = highlightTerms(data.correctedFrom ? data.suggestion : state.q);
        for (const result of results) list.appendChild(resultItem(result, terms));
        renderPager(data, results.length);
    }

    function resultItem(result, terms) {
        const li = document.createElement("li");
        li.className = "result";

        const path = result.path || "";
        const isUrl = /^https?:\/\//i.test(path);
        const title = result.title || fileName(path) || "Document " + result.docId;

        const crumb = document.createElement("span");
        crumb.className = "crumb";
        crumb.innerHTML = breadcrumb(path, isUrl);

        const heading = document.createElement("h3");
        if (isUrl) {
            const link = document.createElement("a");
            link.href = path;
            link.rel = "noopener";
            link.textContent = title;
            heading.appendChild(link);
        } else {
            heading.textContent = title;
        }

        const snippet = document.createElement("p");
        snippet.className = "snippet";
        snippet.innerHTML = highlight(result.snippet || "", terms);

        li.append(crumb, heading, snippet);
        return li;
    }

    function showEmpty(mode) {
        const tips = mode === "phrase"
            ? ["Check the spelling, or drop a word from the phrase.",
               "Remove the quotes to match the words in any order."]
            : mode === "bool"
                ? ["A word joined with AND must appear in every result; try OR instead.",
                   "Check the spelling of each word."]
                : ["Check the spelling.", "Try fewer or more general words.",
                   "Put words in quotes to find an exact phrase, e.g. <code>\"black hole\"</code>."];
        list.className = "results";
        list.innerHTML = '<li class="empty"><h2>No documents match <b>' + escapeHtml(state.q) + "</b></h2><ul>" +
            tips.map(tip => "<li>" + tip + "</li>").join("") + "</ul></li>";
    }

    function showError(message) {
        list.className = "results";
        const hint = "<li>Check that the search server is running, then search again.</li>";
        list.innerHTML = '<li class="empty error"><h2>This search did not run: ' + escapeHtml(message) +
            "</h2><ul>" + hint + "</ul></li>";
    }

    function renderPager(data, count) {
        const known = typeof data.total === "number";
        const reachable = known ? Math.min(data.total, MAX_RESULTS) : MAX_RESULTS;
        const lastPage = known
            ? Math.max(1, Math.ceil(reachable / PAGE_SIZE))
            : (count < PAGE_SIZE ? state.page : Math.min(state.page + 1, MAX_RESULTS / PAGE_SIZE));
        if (lastPage <= 1 && state.page === 1) return;

        const pages = [];
        const start = Math.max(1, Math.min(state.page - 4, lastPage - 9));
        for (let p = start; p <= Math.min(lastPage, start + 9); p++) pages.push(p);

        pager.appendChild(pageButton("Previous", state.page - 1, state.page === 1, "step"));
        for (const p of pages) pager.appendChild(pageButton(String(p), p, false, "", p === state.page));
        pager.appendChild(pageButton("Next", state.page + 1, state.page >= lastPage, "step"));
    }

    function pageButton(label, page, disabled, className, current) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        if (className) button.className = className;
        if (current) {
            button.setAttribute("aria-current", "page");
            button.disabled = true;
        } else if (disabled) {
            button.disabled = true;
        } else {
            button.setAttribute("aria-label", label === String(page) ? "Page " + page : label + " page");
            button.addEventListener("click", () => navigate({ page: page }));
        }
        return button;
    }

    // ---------- formatting helpers ----------

    function breadcrumb(path, isUrl) {
        if (!isUrl) return escapeHtml(path);
        try {
            const url = new URL(path);
            const parts = url.pathname.split("/").filter(Boolean).map(part => {
                try { return decodeURIComponent(part); } catch (e) { return part; }
            });
            return '<span class="host">' + escapeHtml(url.host) + "</span>" +
                parts.map(part => " &rsaquo; " + escapeHtml(part)).join("");
        } catch (e) {
            return escapeHtml(path);
        }
    }

    function fileName(path) {
        const parts = path.split(/[\\/]/);
        return parts[parts.length - 1];
    }

    // Query words to embolden; prefix matching roughly mirrors stemming
    // ("rank" also marks "ranking").
    function highlightTerms(query) {
        const words = query.toLowerCase().split(/[^a-z0-9]+/)
            .filter(word => word.length >= 2 && !IGNORED_WORDS.has(word));
        return Array.from(new Set(words)).map(word => word.length > 4 ? word.slice(0, word.length - 1) : word);
    }

    function highlight(text, terms) {
        if (!terms.length) return escapeHtml(text);
        const pattern = new RegExp("\\b(" + terms.map(escapeRegex).join("|") + ")[a-z0-9]*", "gi");
        let html = "";
        let last = 0;
        for (const match of text.matchAll(pattern)) {
            html += escapeHtml(text.slice(last, match.index)) + "<b>" + escapeHtml(match[0]) + "</b>";
            last = match.index + match[0].length;
        }
        return html + escapeHtml(text.slice(last));
    }

    function formatMillis(ms) {
        return ms < 1 ? ms.toFixed(2) + " ms" : ms < 100 ? ms.toFixed(1) + " ms" : Math.round(ms) + " ms";
    }

    function plural(count, one, many) {
        return count.toLocaleString() + " " + (count === 1 ? one : many);
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[c]);
    }

    function escapeRegex(value) {
        return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    readUrl();
    writeUrl(true);
    render();
})();
</script>
</body>
</html>
