<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Engine</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-2: #273449;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-strong: #0ea5e9;
            --border: #334155;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
        }

        .page {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 16px 64px;
        }

        header h1 {
            font-size: 1.5rem;
            margin: 8px 0 2px;
        }

        header p {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        form {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 12px;
            z-index: 5;
        }

        .search-row {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            font-size: 1rem;
            color: var(--text);
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--accent); }

        button.search-btn {
            padding: 12px 18px;
            font-size: 1rem;
            font-weight: 600;
            color: #06283d;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button.search-btn:hover { background: var(--accent-strong); }

        button.search-btn:disabled { opacity: 0.6; cursor: default; }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 130px;
        }

        .field label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
        }

        select {
            padding: 9px 10px;
            font-size: 0.92rem;
            color: var(--text);
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
        }

        .hint {
            font-size: 0.8rem;
            color: var(--muted);
            min-height: 1.1em;
        }

        .status {
            margin: 18px 2px 8px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .status.error { color: #fca5a5; }

        ul.results {
            list-style: none;
            margin: 8px 0 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        li.result {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
        }

        .result-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .result-path {
            font-weight: 600;
            color: var(--accent);
            word-break: break-all;
        }

        .result-score {
            font-size: 0.78rem;
            color: var(--muted);
            white-space: nowrap;
            background: var(--panel-2);
            border-radius: 999px;
            padding: 2px 10px;
        }

        .result-snippet {
            margin-top: 8px;
            color: var(--text);
            font-size: 0.92rem;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
        }

        /* Desktop / larger screens */
        @media (min-width: 620px) {
            header h1 { font-size: 1.9rem; }
            .search-row { flex-direction: row; }
            button.search-btn { width: auto; }
        }
    </style>
</head>
<body>
<div class="page">
    <header>
        <h1>Search Engine</h1>
        <p>A from-scratch information-retrieval engine &mdash; TF-IDF, BM25, phrase &amp; boolean search.</p>
    </header>

    <form id="search-form" autocomplete="off">
        <div class="search-row">
            <input type="text" id="query" name="query" placeholder="Search the index&hellip;" aria-label="Search query">
            <button type="submit" class="search-btn" id="submit-btn">Search</button>
        </div>

        <div class="options">
            <div class="field">
                <label for="mode">Mode</label>
                <select id="mode">
                    <option value="search">Ranked</option>
                    <option value="phrase">Phrase</option>
                    <option value="bool">Boolean</option>
                </select>
            </div>

            <div class="field" id="ranker-field">
                <label for="ranker">Ranker</label>
                <select id="ranker">
                    <option value="tfidf">TF-IDF</option>
                    <option value="bm25">BM25</option>
                    <option value="cosine">Cosine</option>
                </select>
            </div>

            <div class="field">
                <label for="limit">Results</label>
                <select id="limit">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                </select>
            </div>
        </div>

        <div class="hint" id="hint"></div>
    </form>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <ul class="results" id="results"></ul>

    <footer>Powered by the SearchEngine REST API</footer>
</div>

<script>
    const form = document.getElementById("search-form");
    const queryInput = document.getElementById("query");
    const modeSelect = document.getElementById("mode");
    const rankerField = document.getElementById("ranker-field");
    const rankerSelect = document.getElementById("ranker");
    const limitSelect = document.getElementById("limit");
    const hint = document.getElementById("hint");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const submitBtn = document.getElementById("submit-btn");

    const HINTS = {
        search: "Ranked keyword search. Results ordered by relevance score.",
        phrase: "Phrase search: matches documents where the words appear adjacent, in order.",
        bool: "Boolean search: combine terms with AND, OR, NOT and ( ). e.g. search AND NOT engine"
    };

    function syncMode() {
        const mode = modeSelect.value;
        rankerField.style.display = mode === "search" ? "" : "none";
        hint.textContent = HINTS[mode] || "";
        queryInput.placeholder = mode === "bool"
            ? "e.g. ranking AND (bm25 OR tfidf)"
            : "Search the index…";
    }

    modeSelect.addEventListener("change", syncMode);
    syncMode();

    function buildUrl() {
        const mode = modeSelect.value;
        const q = queryInput.value.trim();
        const params = new URLSearchParams({ q });
        if (mode === "search") {
            params.set("ranker", rankerSelect.value);
        }
        if (mode !== "bool") {
            params.set("limit", limitSelect.value);
        }
        return "/" + mode + "?" + params.toString();
    }

    function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value == null ? "" : String(value);
        return div.innerHTML;
    }

    function render(data) {
        resultsEl.innerHTML = "";
        const results = data.results || [];
        if (results.length === 0) {
            statusEl.textContent = "No matching documents.";
            return;
        }
        statusEl.textContent = results.length + " result" + (results.length === 1 ? "" : "s")
            + " · " + (data.mode || "");
        for (const r of results) {
            const li = document.createElement("li");
            li.className = "result";
            li.innerHTML =
                '<div class="result-head">' +
                '<span class="result-path">' + escapeHtml(r.path || ("doc " + r.docId)) + "</span>" +
                '<span class="result-score">score ' + (Number(r.score).toFixed(4)) + "</span>" +
                "</div>" +
                (r.snippet ? '<div class="result-snippet">' + escapeHtml(r.snippet) + "</div>" : "");
            resultsEl.appendChild(li);
        }
    }

    async function runSearch(event) {
        if (event) event.preventDefault();
        const q = queryInput.value.trim();
        if (!q) {
            queryInput.focus();
            return;
        }
        statusEl.classList.remove("error");
        statusEl.textContent = "Searching…";
        resultsEl.innerHTML = "";
        submitBtn.disabled = true;
        try {
            const response = await fetch(buildUrl());
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || ("HTTP " + response.status));
            }
            render(data);
        } catch (err) {
            statusEl.classList.add("error");
            statusEl.textContent = "Error: " + err.message;
        } finally {
            submitBtn.disabled = false;
        }
    }

    form.addEventListener("submit", runSearch);
</script>
</body>
</html>
